name: ant_design_icons
description: "Ant-design icons package"
publish_to: none
version: 0.4.0
repository: https://github.com/snapsl/flutter_icons
issue_tracker: https://github.com/snapsl/flutter_icons/issues

topics:
  - icons

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  material_ui: ^1.0.0
  test_utils:

flutter:
  fonts:
    - family: AntDesignFilledIcons
      fonts:
        - asset: fonts/antfill.ttf
    - family: AntDesignOutlinedIcons
      fonts:
        - asset: fonts/antoutline.ttf
