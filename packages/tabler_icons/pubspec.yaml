name: tabler_icons
description: "Tabler icons package"
publish_to: none
version: 0.19.0
repository: https://github.com/snapsl/flutter_icons
issue_tracker: https://github.com/snapsl/flutter_icons/issues

topics:
  - icons

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  material_ui: ^1.0.0
  test_utils:

flutter:
  fonts:
    - family: TablerIcons
      fonts:
        - asset: fonts/tabler-icons.ttf
    - family: TablerFilledIcons
      fonts:
        - asset: fonts/tabler-icons-filled.ttf
