name: Generate Icons

on:
  pull_request:
    branches:
      - main
    paths:
      - "vendors/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            antdesign: vendors/ant_design_icons/**
            bootstrap: vendors/bootstrap_icons/**
            hero: vendors/hero_icons/**
            ionic: vendors/ionic_icons/**
            lucide: vendors/lucide_icons/**
            radix: vendors/radix_icons/**
            remix: vendors/remix_icons/**
            simple: vendors/simple_icons/**
            tabler: vendors/tabler_icons/**

      - name: Set matrix
        id: set-matrix
        run: |
          FULL_MATRIX=$(cat .github/matrix/icon_set_matrix.json | jq -c .)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "matrix=$FULL_MATRIX" >> "$GITHUB_OUTPUT"
          else
            CHANGES='${{ steps.filter.outputs.changes }}'
            FILTERED=$(echo "$FULL_MATRIX" | jq -c --argjson changes "$CHANGES" 'map(select(.id as $id | $changes | index($id)))')
            echo "matrix=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    name: "${{ matrix.id }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install npm dependencies
        working-directory: ${{ matrix.vendor_path }}/${{ matrix.package_name }}
        run: npm ci

      - name: Get vendor package version
        id: get-version
        working-directory: ${{ matrix.vendor_path }}/${{ matrix.package_name }}
        run: |
          VERSION=$(npm list ${{ matrix.vendor_name }} --depth=0 --json | jq -er '.dependencies."${{ matrix.vendor_name }}".version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout external repository
        if: matrix.repository
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository.slug }}
          ref: ${{ matrix.repository.tag }}${{ steps.get-version.outputs.version }}
          path: external-repo

      - name: Copy SVGs to vendor
        if: matrix.repository
        run: |
          DEST_DIR="${{ matrix.vendor_path }}/${{ matrix.package_name }}/${{ matrix.fonts[0].svg_path }}"
          mkdir -p "$DEST_DIR"
          cp -r ./external-repo/${{ matrix.repository.svg_path }}/* "$DEST_DIR"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install pip dependencies
        run: pip install -r requirements.txt

      - name: Flatten SVG directories
        if: matrix.flatten_svg_dirs == true
        working-directory: ${{ matrix.vendor_path }}/${{ matrix.package_name }}
        env:
          FONTS_JSON: ${{ toJSON(matrix.fonts) }}
        run: |
          echo "$FONTS_JSON" | jq -c '.[]' | while read -r font_item; do
            SVG_PATH=$(echo "$font_item" | jq -r '.svg_path')
            find "$SVG_PATH" -mindepth 2 -type f -name "*.svg" -exec mv -t "$SVG_PATH" {} +
          done

      - name: Install svgtofont, SVG Fixer
        if: matrix.svg_to_font == true
        run: npm ci

      - name: Convert SVG to Font
        if: matrix.svg_to_font == true
        env:
          FONTS_JSON: ${{ toJSON(matrix.fonts) }}
        run: |
          echo "$FONTS_JSON" | jq -c '.[]' | while read -r font_item; do
            SVG_PATH="${{ matrix.vendor_path }}/${{ matrix.package_name }}/$(echo "$font_item" | jq -r '.svg_path')"
            FONT_FILE=$(echo "$font_item" | jq -r '.file')
            FONT_PATH="${{ matrix.vendor_path }}/${{ matrix.package_name }}/$(echo "$font_item" | jq -r '.font_path')"

            SVG_FIXED_PATH=$(mktemp -d)

            npx oslllo-svg-fixer --source "$SVG_PATH" --destination "$SVG_FIXED_PATH" --show-progress false
            npx svgtofont --sources "$SVG_FIXED_PATH" --output "$FONT_PATH" --fontName "${FONT_FILE%.ttf}"
          done

      - name: Convert WOFF to TTF
        if: matrix.convert_from_woff == true
        working-directory: ${{ matrix.vendor_path }}/${{ matrix.package_name }}
        run: |
          WOFF=$(find . -name "*.woff")
          for woff in $WOFF; do
            ttx ${woff}
            ttx ${woff%.woff}.ttx
          done

      - name: Generate ttx for ${{ matrix.id }}
        working-directory: ${{ matrix.vendor_path }}/${{ matrix.package_name }}
        env:
          FONTS_JSON: ${{ toJSON(matrix.fonts) }}
        run: |
          echo "$FONTS_JSON" | jq -c '.[]' | while read -r font_item; do
            FONT_FILE=$(echo "$font_item" | jq -r '.file')
            FONT_PATH=$(echo "$font_item" | jq -r '.font_path')
            ttx -t cmap "${FONT_PATH}/${FONT_FILE}"
          done

      - name: Copy fonts to package
        working-directory: ${{ matrix.vendor_path }}/${{ matrix.package_name }}
        env:
          FONTS_JSON: ${{ toJSON(matrix.fonts) }}
        run: |
          echo "$FONTS_JSON" | jq -c '.[]' | while read -r font_item; do
            FONT_FILE=$(echo "$font_item" | jq -r '.file')
            FONT_PATH=$(echo "$font_item" | jq -r '.font_path')
            mkdir -p "../../${{ matrix.package_path }}/${{ matrix.package_name }}/fonts"
            cp "${FONT_PATH}/${FONT_FILE}" "../../${{ matrix.package_path }}/${{ matrix.package_name }}/fonts/${FONT_FILE}"
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate icons for ${{ matrix.id }}
        run: dart run tools/generate_icons.dart --iconset ${{ matrix.id }}

      - name: Format code
        run: dart format ${{ matrix.package_path }}/${{ matrix.package_name }}/

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          add-paths: ${{ matrix.package_path }}/${{ matrix.package_name }}/*
          sign-commits: true
          base: main
          title: "feat(${{ matrix.package_name }}): bump version to ${{ steps.get-version.outputs.version }}"
          commit-message: "bump ${{ matrix.vendor_name }} to version ${{ steps.get-version.outputs.version }}"
          branch: "feat/update-${{ matrix.id }}-${{ steps.get-version.outputs.version }}"
          delete-branch: true
          body: |
            ### 🤖 Icon Generation
            Icons have been automatically generated for `${{ matrix.package_name }}`.

            *Generated by: ${{ github.workflow }}*
          labels: automated pr
